<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 1s ease-in-out infinite}@keyframes body{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.eyes{animation:glance 1s ease-in-out infinite}@keyframes glance{0%{transform:translate(-4px,0px)}50%{transform:translate(4px,0px)}100%{transform:translate(-4px,0px)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.clk{transform-box:fill-box;transform-origin:50% 50%;animation:clk .25s linear infinite}@keyframes clk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.hand{transform-box:view-box;transform-origin:208px 262px;animation:hand 2s linear infinite}@keyframes hand{to{transform:rotate(360deg)}}.mot{animation:mot .8s ease-in-out infinite;opacity:0}@keyframes mot{0%,100%{opacity:0}50%{opacity:.9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334"