<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 6s ease-in-out infinite}@keyframes body{0%,100%{transform:translateY(4px) rotate(2deg)}50%{transform:translateY(10px) rotate(4deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 5s ease-in-out infinite}@keyframes blink{0%,60%,74%,100%{transform:scaleY(1)}66%,68%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.dot{animation:dot 2.1s ease-in-out infinite;opacity:.2}@keyframes dot{0%,100%{opacity:.2}20%,60%{opacity:1}}.hg{transform-box:fill-box;transform-origin:50% 50%;animation:hg 4s ease-in-out infinite}@keyframes hg{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></clipPath><g clip-path="url(#cloudc)"><rect x="60" y="100" width="290" height="200" fill="#E6E9F5"/><g transform="translate(9 -7)" fill="#FFFFFF"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></g></g><g class="pawl"><ellipse cx="112" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g class="pawr"><ellipse cx="292" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g transform="translate(-11 46)"><g class="face"><g class="eyes"><ellipse cx="189" cy="166" rx="8" ry="10.5" fill="#1E1E1E"/><circle cx="192.0" cy="161.3" r="3.0" fill="#FFFFFF"/><circle cx="186.6" cy="169.7" r="1.4" fill="#FFFFFF"/><rect x="172" y="150" width="24" height="13" fill="#FFFFFF"/><path d="M174,163 L194,163" stroke="#1E1E1E" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="247" cy="166" rx="8" ry="10.5" fill="#1E1E1E"/><circle cx="250.0" cy="161.3" r="3.0" fill="#FFFFFF"/><circle cx="244.6" cy="169.7" r="1.4" fill="#FFFFFF"/><rect x="230" y="150" width="24" height="13" fill="#FFFFFF"/><path d="M232,163 L252,163" stroke="#1E1E1E" stroke-width="2.6" stroke-linecap="round"/></g><path d="M206,186 L220,186" fill="none" stroke="#1E1E1E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g><circle class="dot" style="animation-delay:0.0s" cx="284" cy="92" r="6.5" fill="#FFFFFF"/><circle class="dot" style="animation-delay:0.35s" cx="304" cy="92" r="6.5" fill="#FFFFFF"/><circle class="dot" style="animation-delay:0.7s" cx="324" cy="92" r="6.5" fill="#FFFFFF"/><g transform="translate(28 12)"><g class="hg"><path d="M300,250 L340,250 L320,272 L340,294 L300,294 L320,272 Z" fill="#FFFFFF" fill-opacity=".85" stroke="#8A7A66" stroke-