<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 5s ease-in-out infinite}@keyframes body{0%,100%{transform:translateY(4px) scale(1,.98)}50%{transform:translateY(8px) scale(1.01,.97)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 5s ease-in-out infinite}@keyframes blink{0%,60%,74%,100%{transform:scaleY(1)}66%,68%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.cloudb{animation:cb 4s ease-in-out infinite}@keyframes cb{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}.drop{animation:drop .9s linear infinite;opacity:0}@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}.tear{animation:tear 2.4s ease-in infinite}@keyframes tear{0%,15%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(30px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><ci