<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 1.4s ease-in-out infinite}@keyframes body{0%,40%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(-5px) rotate(-3deg)}50%{transform:translateX(5px) rotate(3deg)}55%{transform:translateX(-5px) rotate(-3deg)}60%{transform:translateX(5px) rotate(3deg)}65%{transform:translateX(0)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.vein{transform-box:fill-box;transform-origin:50% 50%;animation:vein .6s ease-in-out infinite}@keyframes vein{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 1.2s ease-out infinite;opacity:0}@keyframes puff{0%{transform:translateY(8px) scale(.4);opacity:0}30%{opacity:.9}100%{transform:translateY(-30px) scale(1.3);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle