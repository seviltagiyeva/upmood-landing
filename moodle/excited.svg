<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body .8s cubic-bezier(.3,0,.4,1) infinite}@keyframes body{0%,100%{transform:translateY(0) scale(1.06,.94)}40%{transform:translateY(-22px) scale(.96,1.05) rotate(-3deg)}60%{transform:translateY(-22px) scale(.97,1.04) rotate(3deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.twk{transform-origin:50% 50%;animation:twk 1.1s ease-in-out infinite}@keyframes twk{0%,100%{transform:scale(.8)}50%{transform:scale(1.2) rotate(45deg)}}.hat{transform-box:fill-box;transform-origin:50% 100%;animation:hat .7s ease-in-out infinite alternate}@keyframes hat{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}.conf{transform-box:fill-box;transform-origin:50% 50%;animation:conf 2.2s linear infinite}@keyframes conf{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(420px) rotate(540deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="3