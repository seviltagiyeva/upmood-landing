<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body .25s linear infinite}@keyframes body{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-.6deg)}75%{transform:translateX(2px) rotate(.6deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.eyes{animation:glance 2.2s ease-in-out infinite}@keyframes glance{0%{transform:translate(0px,0px)}25%{transform:translate(4px,0px)}45%{transform:translate(4px,0px)}60%{transform:translate(-2px,0px)}80%{transform:translate(4px,0px)}100%{transform:translate(0px,0px)}}.pawl{transform-origin:50% 50%;animation:pawl .6s ease-in-out infinite alternate}.pawr{transform-origin:50% 50%;animation:pawr .6s ease-in-out infinite alternate}@keyframes pawl{from{transform:translate(0,0)}to{transform:translate(6px,-4px)}}@keyframes pawr{from{transform:translate(0,-4px)}to{transform:translate(-6px,0)}}.sweat{animation:sweat 1.8s ease-in infinite}@keyframes sweat{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" 