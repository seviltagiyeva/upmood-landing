<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 5s ease-in-out infinite}@keyframes body{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 5s ease-in-out infinite}@keyframes blink{0%,60%,74%,100%{transform:scaleY(1)}66%,68%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.steam{animation:steam 2.4s ease-in-out infinite;opacity:0}@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.85}100%{transform:translateY(-14px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></clipPath><g clip-path="url(#cloudc)"><rect x="60" y="100" width="290" height="20