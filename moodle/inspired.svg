<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 2.4s cubic-bezier(.3,1.6,.5,1) infinite}@keyframes body{0%,100%{transform:scale(1) translateY(0)}20%{transform:scale(1.08) translateY(-10px)}40%{transform:scale(1)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.twk{transform-origin:50% 50%;animation:twk 1.1s ease-in-out infinite}@keyframes twk{0%,100%{transform:scale(.8)}50%{transform:scale(1.2) rotate(45deg)}}.bulb{transform-box:fill-box;transform-origin:50% 100%;animation:bulb 2s ease-in-out infinite}@keyframes bulb{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}}.rays{transform-box:fill-box;transform-origin:50% 100%;animation:rays 2s ease-in-out infinite}@keyframes rays{0%,100%{opacity:.2}15%,45%{opacity:1}}.brush{transform-box:fill-box;transform-origin:0% 100%;animation:brush 1.2s ease-in-out infinite}@keyframes brush{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}.dab{transform-box:fill-box;transform-origin:50% 50%;animation:dab 1.5s ease-out infinite;opacity:0}@keyframes dab{0%{transform:scale(0);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></clipPath><g clip-path="url(#cloudc)"><rect x="60" y="100" width="290" height="200" fill="#E6E9F5"/><g transform="translate(9 -7)" fill="#FFFFFF"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></g></g><g class="pawl"><ellipse cx="112" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g class="pawr"><ellipse cx="292" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g transform="translate(-6 8)"><g class="brush"><path d="M236,262 L284,214" stroke="#C98A5A" stroke-width="7" stroke-linecap="round"/><path d="M280,212 L292,200 C298,196 304,202 300,208 L288,220 Z" fill="#9A9AA8"/><path d="M296,198 C304,186 316,186 314,196 C310,204 302,206 296,198 Z" fill="#7C6BD6"/></g><circle class="dab" style="animation-delay:0s" cx="318" cy="176" r="5" fill="#7C6BD6"/><circle class="dab" style="animation-delay:0.5s" cx="334" cy="196" r="5" fill="#E8505B"/><circle class="dab" style="animation-delay:1s" cx="326" cy="160" r="5" fill="#7FD1C7"/></g><g transform="translate(-11 46)"><g class="face"><g clas