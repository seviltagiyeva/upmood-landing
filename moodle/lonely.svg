<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 6s ease-in-out infinite}@keyframes body{0%,100%{transform:translateY(6px) rotate(-2deg)}50%{transform:translateY(6px) rotate(2deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 5s ease-in-out infinite}@keyframes blink{0%,60%,74%,100%{transform:scaleY(1)}66%,68%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.scarft{transform-box:fill-box;transform-origin:50% 0%;animation:scarft 3s ease-in-out infinite}@keyframes scarft{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}.fleaf{transform-box:fill-box;transform-origin:50% 50%;animation:fleaf 6s ease-in-out infinite}@keyframes fleaf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(-60px,120px) rotate(120deg)}90%{opacity:1}100%{transform:translate(-20px,250px) rotate(240deg);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></clipPath><g clip-path="url(#cloudc)"><rect x="60" y="100" width="290" height="200" fill="#E6E9F5"/><g transform="translate(9 -7)" fill="#FFFFFF"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></g></g><g class="pawl"><ellipse cx="112" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g class="pawr"><ellipse cx="292" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><path d="M100,252 C150,270 254,270 304,252 L304,268 C254,288 150,288 100,268 Z" fill="#6B8FD6"/><g class="scarft"><path d="M262,266 L278,312 L258,314 L248,270 Z" fill="#5A7CC4"/></g><g transform="translate(-11 46)"><g class="face"><g class="eyes"><ellipse cx="179" cy="168" rx="8" ry="10.5" fill="#1E1E1E"/><circle cx="182.0" cy="163.3" r="3.0" fill="#FFFFFF"/><circle cx="176.6" cy="171.7" r="1.4" fill="#FFFFFF"/><ellipse cx="237" cy="168" rx="8" ry="10.5" fill="#1E1E1E"/><circle cx="240.0" cy="163.3" r="3.0" fill="#FFFFFF"/><circle cx="234.6" cy="171.7" r="1.4" fill="#FFFFFF"/></g><path d="M174,146 L190,140 M252,146 L236,140" stroke="#1E1E1E" stroke-width="2.6" stroke-linecap="round"/><path d="M206,186 L220,186" fill="none" stroke="#1E1E1E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g><g class="fleaf"><path d="M0,0 C8,-12 24,-12 30,0 C24,10 8,10 0,0 Z" fill="#E59A4A" transform="translate(300 40) rotate(20)"/></g></svg>