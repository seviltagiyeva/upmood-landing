<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 3.2s ease-in-out infinite}@keyframes body{0%,100%{transform:rotate(0)}20%,45%{transform:rotate(-8deg)}60%,85%{transform:rotate(6deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.eyes{animation:glance 3.2s ease-in-out infinite}@keyframes glance{0%{transform:translate(0px,0px)}25%{transform:translate(-4px,-2px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,-2px)}85%{transform:translate(4px,-2px)}100%{transform:translate(0px,0px)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.mag{transform-box:fill-box;transform-origin:0% 100%;animation:mag 3s ease-in-out infinite}@keyframes mag{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) translate(4px,-6px)}}.bfly{animation:bfly 5s ease-in-out infinite}@keyframes bfly{0%,100%{transform:translate(0,0)}25%{transform:translate(-20px,-16px)}50%{transform:translate(-6px,-30px)}75%{transform:translate(10px,-12px)}}.wing{transform-box:fill-box;transform-origin:50% 50%;animation:wing .3s ease-in-out infinite alternate}@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></clipPath><g clip-path="url(#cloudc)"><rect x="60" y="100" width="290" height="200" fill="#E6E9F5"/><g transform="translate(9 -7)" fill="#FFFFFF"><circle cx="140" cy="214" r="52"/><circle cx="200" cy="178" r="64"/><circle cx="262" cy="208" r="50"/><circle cx="110" cy="244" r="36"/><circle cx="292" cy="244" r="36"/><circle cx="170" cy="250" r="44"/><circle cx="236" cy="250" r="44"/><rect x="96" y="232" width="212" height="54" rx="27"/></g></g><g class="pawl"><ellipse cx="112" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g class="pawr"><ellipse cx="292" cy="270" rx="16" ry="12" fill="#FFFFFF" stroke="#E6E9F5" stroke-width="2"/></g><g transform="translate(-6 8)"><g class="mag"><path d="M236,262 L262,232" stroke="#8A5A3A" stroke-width="9" stroke-linecap="round"/><circle cx="280" cy="210" r="28" fill="#DDF3FF" fill-opacity=".55" stroke="#4A4A55" stroke-width="7"/><path d="M266,198 Q272,190 282,190" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/></g></g><g transform="translate(-11 46)"><g class="face"><g class="eyes"><ellipse cx="188" cy="163" rx="9.5" ry="12" fill="#1E1E1E"/><circle cx="191.6" cy="157.6" r="3.6" fill="#FFFFFF"/><circle cx="185.2" cy="167.2" r="1.6" fill="#FFFFFF"/><ellipse cx="246" cy="163" rx="9.5" ry="12" fill="#1E1E1E"/><circle cx="249.6" cy="157.6" r="3.6" fill="#FFFFFF"/><circle cx="243.2" cy="167.2" r="1.6" fill="#FFFFFF"/></g><ellipse cx="213" cy="188" rx="5" ry="6" fill="#5A2430" stroke="#1E1E1E" stroke-width="2"/></g></g></g></g><g class="bfly"><g class="wing"><path d="M0,0 C-14,-16 -22,-2 -12,6 C-20,14 -8,20 0,4 Z M0,0 C14,-16 22,-2 12,6 C20,14 8,20 0,4 Z" fill="#FFD166" transform="translate(320 120)"/></g><path d="M320,118 L320,128" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round"/></g></svg>