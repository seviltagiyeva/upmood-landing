<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.cat,.face,.eyes,.pawl,.pawr,.spin,.twk,.yawn{transform-box:fill-box}.cat{transform-origin:50% 100%;animation:body 4s ease-in-out infinite}@keyframes body{0%,100%{transform:translateX(0) rotate(0)}40%,70%{transform:translateX(8px) rotate(5deg)}}.float{animation:float 3.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 3.6s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}.face{transform-origin:50% 50%;animation:faceb 4s ease-in-out infinite}@keyframes faceb{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}.eyes{transform-origin:50% 50%;animation:blink 4s ease-in-out infinite}@keyframes blink{0%,38%,46%,82%,86%,90%,100%{transform:scaleY(1)}42%,84%,88%{transform:scaleY(.1)}}.pawl{transform-origin:100% 50%;animation:arml 2.4s ease-in-out infinite}.pawr{transform-origin:0% 50%;animation:armr 2.4s ease-in-out infinite}@keyframes arml{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes armr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}.fish{transform-box:fill-box;transform-origin:50% 100%;animation:fish 2s ease-in-out infinite}@keyframes fish{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.sp{transform-box:fill-box;transform-origin:50% 50%;animation:sp 1.8s ease-in-out infinite}@keyframes sp{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}.gloom{animation:gloom 2s ease-in-out infinite}@keyframes gloom{0%,100%{opacity:.35}50%{opacity:.9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="202" cy="334" rx="86" ry="10" fill="#2A2340" fill-opacity=".13"/><g class="float"><g class="cat"><clipPath id="cloudc"><circle cx="140" cy="214" r="52"/><circ